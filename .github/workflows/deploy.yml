name: Deploy Heail

on:
  push:
    branches:
      - dev

concurrency:
  group: heail-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=== Acquiring deployment lock ==="
            exec 9>/tmp/heail-deploy.lock
            flock -w 900 9

            echo "=== Pulling backend ==="
            cd ~/heail/heail-backend
            git checkout dev
            git pull origin dev

            echo "=== Pulling frontend ==="
            cd ~/heail/heail-frontend
            git checkout dev
            git pull origin dev

            echo "=== Building Docker images ==="
            cd ~/heail
            docker compose build backend frontend

            echo "=== Stopping application services ==="
            docker compose stop backend frontend || true

            echo "=== Removing application containers ==="
            docker compose rm -f backend frontend || true

            echo "=== Starting application services ==="
            docker compose up -d backend frontend

            echo "=== Waiting for backend health ==="
            sleep 20

            echo "=== Checking containers ==="
            docker compose ps backend frontend

            echo "=== Checking backend health ==="
            docker exec heail-backend-1 sh -c \
              'curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/actuator/health'

            echo "=== Deployment complete ==="