spring.application.name=heail-backend

# ── Database (defaults match the existing Neon instance; override via env vars
# in Docker/production so credentials don't need to live in source control)

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.xpmkaewgxffvmkotcjjn}
spring.datasource.password=${DB_PASSWORD:Amazon@h1h2h3}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ── JWT
jwt.secret=${JWT_SECRET:heail-secret-key-change-in-production-min-256-bits!!}
jwt.access-token-expiry-ms=86400000
jwt.refresh-token-expiry-ms=2592000000

# ── Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:contact@heail.in}
spring.mail.password=${MAIL_PASSWORD:eypf pnxn aven fdkw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Razorpay (Indian/INR payments — the only gateway now)
# All three below are placeholders — replace via env vars once you have real
# Razorpay dashboard values (see RAZORPAY_KEY_ID etc.). Harmless as placeholders
# since app.payments.razorpay-enabled is false below.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TOxuu7hnAE6l2K}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:TPuMgcpsBSCRuuDNc0Io6YnH}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:@1b2c3d4$}
razorpay.api-base=${RAZORPAY_API_BASE:https://api.razorpay.com}
# Disabled for now — createRazorpayOrder() skips the real gateway and marks the
# order PAID directly (see OrderService/OrgOrderService). Flip to true (or set
# PAYMENT_RAZORPAY_ENABLED=true) once real Razorpay Key ID/Secret are in place.
app.payments.razorpay-enabled=${PAYMENT_RAZORPAY_ENABLED:false}

# ── SMS (MSG91) — OTP delivery for registration + partner applications,
# alongside the existing email OTP. Placeholders below, same reasoning as Razorpay.
msg91.auth-key=${MSG91_AUTH_KEY:MSG91_AUTH_KEY_PLACEHOLDER}
msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:MSG91_OTP_TEMPLATE_ID_PLACEHOLDER}
msg91.api-base=${MSG91_API_BASE:https://control.msg91.com}
# Disabled for now — sendOtp() logs and skips instead of calling MSG91. Flip to
# true (or set SMS_MSG91_ENABLED=true) once a real MSG91 account/template is in place.
app.sms.msg91-enabled=${SMS_MSG91_ENABLED:false}

# ── Superadmin bootstrap (optional) — if both are set and no user with this
# email exists yet, a SUPERADMIN account is created on startup. Leave blank
# (the default) to skip, e.g. once you've already created your own admin account.
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ── Server
server.port=8080

# ── Health check (Docker HEALTHCHECK / EC2 monitoring hit this — no auth,
# no sensitive detail exposed, just up/down)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Frontend (used to build links in outgoing emails)
app.frontend.base-url=${FRONTEND_BASE_URL:https://heail.in}
