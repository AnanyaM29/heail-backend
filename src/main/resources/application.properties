spring.application.name=heail-backend

# ── AWS Secrets Manager — DB and Razorpay credentials live in the secret
# named below, as JSON keys matching the property placeholders used
# throughout this file (DB_URL, DB_USERNAME, DB_PASSWORD, RAZORPAY_KEY_ID,
# RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET). Loaded at startup via the AWS
# default credential chain (env vars / ~/.aws/credentials / EC2 instance
# role) — see AWS_SECRETS.md. Fails startup if the secret can't be fetched,
# by design — a missing/wrong AWS credential should be loud, not silently
# fall back to nothing.
spring.config.import=aws-secretsmanager:${AWS_SECRET_NAME:heail/backend}

# ── Database (no local fallback — value comes from AWS Secrets Manager above)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP defaults to a pool of 10 connections *per running instance* — way
# too large for Supabase's pooler in session mode, which caps at 15 total
# concurrent clients across everything hitting it (local dev, EC2, tests,
# all at once). Capped small so multiple instances can coexist without
# exhausting it (see the EMAXCONNSESSION errors this was causing).
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ── JWT
jwt.secret=${JWT_SECRET:heail-secret-key-change-in-production-min-256-bits!!}
jwt.access-token-expiry-ms=86400000
jwt.refresh-token-expiry-ms=2592000000

# ── Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:contact@heail.in}
spring.mail.password=${MAIL_PASSWORD:eypf pnxn aven fdkw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Razorpay (Indian/INR payments — the only gateway now)
# Key ID/secret/webhook secret come from AWS Secrets Manager above (no local
# fallback — see AWS_SECRETS.md).
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
razorpay.api-base=${RAZORPAY_API_BASE:https://api.razorpay.com}
# Disabled for now — createRazorpayOrder() skips the real gateway and marks the
# order PAID directly (see OrderService/OrgOrderService). Flip to true (or set
# PAYMENT_RAZORPAY_ENABLED=true) once real Razorpay Key ID/Secret are in place.
app.payments.razorpay-enabled=${PAYMENT_RAZORPAY_ENABLED:true}

# ── SMS (MSG91) — OTP delivery for registration + partner applications,
# alongside the existing email OTP. Placeholders below, same reasoning as Razorpay.
msg91.auth-key=${MSG91_AUTH_KEY:MSG91_AUTH_KEY_PLACEHOLDER}
msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:MSG91_OTP_TEMPLATE_ID_PLACEHOLDER}
msg91.api-base=${MSG91_API_BASE:https://control.msg91.com}
# Disabled for now — sendOtp() logs and skips instead of calling MSG91. Flip to
# true (or set SMS_MSG91_ENABLED=true) once a real MSG91 account/template is in place.
app.sms.msg91-enabled=${SMS_MSG91_ENABLED:false}

# ── Superadmin bootstrap (optional) — if both are set and no user with this
# email exists yet, a SUPERADMIN account is created on startup. Leave blank
# (the default) to skip, e.g. once you've already created your own admin account.
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ── Server
server.port=8080

# ── Uploads — Spring's own multipart ceiling defaults to 1MB, which sits right
# next to the 500KB business limit PartnerService enforces on resumes (see
# MAX_RESUME_BYTES). Raised well clear of it so any resume over 500KB reaches
# that check and gets the friendly "Attached file is more than 500 KB" message,
# instead of a bigger file tripping this framework-level limit first and
# surfacing a raw MaxUploadSizeExceededException.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Health check (Docker HEALTHCHECK / EC2 monitoring hit this — no auth,
# no sensitive detail exposed, just up/down)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Frontend (used to build links in outgoing emails)
app.frontend.base-url=${FRONTEND_BASE_URL:https://heail.in}
